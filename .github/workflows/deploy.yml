name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      # 新增/修改 SVG
      - 'src/assets/svgs/**'
      # 样式与组件代码
      - 'src/**'
      - 'public/**'
      - 'index.html'
      # 构建相关配置
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'postcss.config.js'
      - 'tailwind.config.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 首次运行时仓库尚未启用 Pages，自动启用并把 source 设为 GitHub Actions
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
